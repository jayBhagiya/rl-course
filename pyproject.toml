[project]
name = "rl-course"
version = "0.1.0"
description = "Reproducible reinforcement-learning course demos and exercises"
requires-python = ">=3.10"
dependencies = [
    "gymnasium[classic-control,toy-text]>=1.2,<2",
    "numpy>=1.26,<3",
    "racetrackgym==0.3.0",
    "torch>=2.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_course"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
